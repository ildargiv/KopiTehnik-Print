name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build PhotoCropQt.exe
        run: pyinstaller --noconfirm PhotoCropQt.spec

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (python installer/app_version.py).Trim()
          Write-Host "Version $ver"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$ver" installer\PhotoCrop.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Check build output
        run: dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoCrop-windows
          path: |
            dist/PhotoCropQt.exe
            dist/KopiTehnikPrint-Setup-*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PhotoCropQt.exe
            dist/KopiTehnikPrint-Setup-*.exe
          body_path: RELEASE_NOTES.md
